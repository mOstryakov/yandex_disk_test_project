[project]
name = "yandex-disk-test-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Matvey Ostryakov",email = "m.ostryakov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.3.0,<27.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 79
